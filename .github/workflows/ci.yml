name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to a pull request makes its older run worthless, so cancel it. Every commit on main
# gets a run of its own that finishes, because a merge right after another would otherwise cancel
# the first merge's run and leave that commit unchecked (#604): a group shared by pushes to main
# also cancels a pending run, even with cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to the CLI that generated src/lib/supabase/database.types.ts, so db:types:check
  # compares like with like. Bump both together.
  SUPABASE_CLI_VERSION: 3.2.0
  # supabase/config.toml enables GitHub sign-in through env(); CI never signs in with GitHub,
  # so placeholders let the local stack start without a real OAuth app.
  SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID: ci-placeholder
  SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET: ci-placeholder

jobs:
  checks:
    name: Typecheck, lint, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Gitleaks v8.30.1, the official image, pinned by digest. Bump the tag and digest together.
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit on every branch, so a secret committed and later deleted is still found.
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks CLI from its official image needs no license key and no third-party action.
      # Pushed commits that added sample values are allowlisted by SHA in .gitleaks.toml.
      - name: Scan git history with gitleaks
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/gitleaks.log"
          status=0
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo "${GITLEAKS_IMAGE}" \
            detect --source . --redact --verbose --no-banner --no-color 2> "${log}" || status=$?
          cat "${log}"
          # Gitleaks exits 0 when git itself fails (it logs ERR and scans 0 commits), so a scan
          # that read no history fails here instead of passing silently.
          if grep -q ' ERR ' "${log}" || ! grep -qE ' INF [1-9][0-9]* commits scanned' "${log}"; then
            echo "::error::Gitleaks did not scan the git history. See the log above."
            exit 1
          fi
          exit "${status}"

  db:
    name: Database lint, types, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # supabase/config.toml publishes the stack on fixed host ports in the 554xx range, inside
      # Linux's default ephemeral range (32768 to 60999). An outbound connection, such as an image
      # pull, that takes one of them as its source port makes Docker's bind fail with "address
      # already in use" until the socket leaves TIME_WAIT (#527). Reserving the range first keeps
      # the kernel from handing those ports out; explicit binds still work.
      - name: Reserve the local Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55400-55499

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: bash .github/scripts/start-supabase.sh

      # --fail-on defaults to none, which would let lint errors pass silently.
      - name: Lint database
        run: supabase db lint --level error --fail-on error

      - name: Check generated database types are current
        run: npm run db:types:check

      - name: Database tests
        run: npm run test:db

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  # Chromium, plus the WebKit and Firefox touch projects (#578). The "Protect main" ruleset requires
  # a check by this exact name: rename it only together with the ruleset
  # (docs/internal/hosted-instance.md).
  #
  # Setup and the suite have separate budgets (#641): a slow Ubuntu mirror once stretched the
  # Playwright install to 20 minutes, and the job's single timeout then cancelled the suite. Each
  # slow step now has its own timeout, and the job's is their sum plus about 8 minutes for the
  # rest (checkout, npm ci, starting Supabase with its retries): 22 + 5 + 20 + 8 = 55. Typical
  # times: system packages under a minute, browsers under a minute, the suite 9 to 12 minutes.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      # Keeps the stack's ports out of the ephemeral range. See the db job.
      - name: Reserve the local Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55400-55499

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # From the runner's Ubuntu mirror. Usually under a minute; the slowest run seen took 20
      # minutes, which this budget still lets finish. Retrying would not help: apt goes back to the
      # same mirror.
      - name: Install Playwright system packages
        timeout-minutes: 22
        run: npx playwright install-deps chromium webkit firefox

      # WebKit and Firefox run the `@touch` projects (playwright.config.ts, #578).
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install chromium webkit firefox

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: bash .github/scripts/start-supabase.sh

      # Every value here belongs to the throwaway local stack or is generated per run, so the job
      # needs no repository secrets and passes on pull requests from forks.
      - name: Write .env.local
        run: |
          set -euo pipefail
          # `-o env` prints KEY="VALUE" lines, so sourcing it parses the quoting correctly.
          set -a
          # shellcheck disable=SC1090
          source <(supabase status -o env)
          set +a
          for name in API_URL PUBLISHABLE_KEY SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::supabase status -o env did not print ${name}"
              exit 1
            fi
          done
          encryption_key="$(openssl rand -base64 32)"
          cron_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${encryption_key}"
          echo "::add-mask::${cron_secret}"
          umask 077
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "STACKDASH_ENCRYPTION_KEY=${encryption_key}"
            echo "CRON_SECRET=${cron_secret}"
            # The fake provider drives the connect and sync flows without network or real apps.
            echo "STACKDASH_ENABLE_FAKE_PROVIDER=1"
            echo "FAKE_PROVIDER_CLIENT_ID=fake-client"
            echo "FAKE_PROVIDER_CLIENT_SECRET=fake-secret"
            # Alert email (#152) needs nothing here: playwright.config.ts starts the fake
            # Resend API (#244) and gives the app its URL and a dummy key. Nor does the public
            # origin: playwright.config.ts sets NEXT_PUBLIC_SITE_URL to the app server's own,
            # which the production build and its alert links and metadata use (#338).
            # The e2e channel test posts to a webhook receiver on 127.0.0.1, which a
            # production build refuses unless this is set (#153).
            echo "STACKDASH_ALLOW_PRIVATE_WEBHOOKS=1"
          } > .env.local

      - name: End-to-end tests
        timeout-minutes: 20
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop
