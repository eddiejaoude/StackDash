name: CodeQL

# Advanced setup for CodeQL code scanning. Alerts appear in the repository's Security and quality
# tab and as a code scanning check on each pull request. This conflicts with CodeQL default setup:
# keep default setup off in the repository settings while this workflow exists.
# Docs: https://docs.github.com/en/code-security/reference/code-scanning/workflow-configuration-options
on:
  pull_request:
  push:
    branches:
      - main
  # Weekly, so queries published after the last push still reach code that has not changed.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# As in ci.yml (#604): cancel superseded pull request runs, never a run for a commit on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the SARIF results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The workflows in .github/workflows.
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by SHA like every other action here. GitHub recommends a major tag for this action
      # because old releases lose server-side features, so Dependabot (.github/dependabot.yml)
      # keeps the pin current.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
