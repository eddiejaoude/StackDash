name: CodeQL

# Advanced setup for CodeQL code scanning. Alerts appear in the repository's Security tab and as a
# code scanning check on each pull request. This conflicts with CodeQL default setup: keep default
# setup off in the repository settings while this workflow exists.
# Docs: https://docs.github.com/en/code-security/reference/code-scanning/workflow-configuration-options
on:
  pull_request:
  push:
    branches:
      - main
  # Weekly, so queries published after the last push still reach code that has not changed.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the SARIF results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The workflows in .github/workflows.
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by SHA like every other action here. GitHub recommends a major tag for this action
      # because old releases lose server-side features, so Dependabot (.github/dependabot.yml)
      # keeps the pin current.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
